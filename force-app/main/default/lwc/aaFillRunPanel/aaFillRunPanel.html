<template>
    <!-- Gate mode: app not ready to fill yet (Stage < Data Complete OR
         declaration not signed) AND no live/succeeded run exists.
         Renders a friendly precondition message instead of engine errors. -->
    <template lwc:if={isGated}>
        <lightning-card title="Latest Fill Run" icon-name="standard:record_lookup">
            <div class="slds-p-horizontal_medium slds-p-bottom_medium aa-fillrun">
                <div class="slds-notify slds-notify_alert aa-fillrun__gate"
                     role="status">
                    <lightning-icon icon-name="utility:info" size="small"
                                    alternative-text="Waiting"
                                    class="slds-m-right_small">
                    </lightning-icon>
                    <div>
                        <p class="slds-text-body_regular slds-text-color_default aa-fillrun__gate-title">
                            <strong>{gateHeadline}</strong>
                        </p>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                            {gateMessage}
                        </p>
                    </div>
                </div>
            </div>
        </lightning-card>
    </template>

    <template lwc:elseif={hasRun}>
        <lightning-card title="Latest Fill Run" icon-name="standard:record_lookup">
            <div class="slds-p-horizontal_medium slds-p-bottom_medium aa-fillrun">

                <!-- Row 1: status badge + started-at (relative) -->
                <div class="slds-grid slds-grid_vertical-align-center slds-wrap aa-fillrun__status-row">
                    <span class={statusBadgeClass}>{statusLabel}</span>
                    <template lwc:if={hasStartedAt}>
                        <span class="slds-text-body_small slds-text-color_weak slds-m-left_small">
                            Started&nbsp;
                            <lightning-formatted-date-time
                                value={startedAt}
                                year="numeric" month="short" day="2-digit"
                                hour="2-digit" minute="2-digit">
                            </lightning-formatted-date-time>
                        </span>
                    </template>
                </div>

                <!-- Row 2: progress bar (only while running / done with %) -->
                <template lwc:if={hasProgress}>
                    <div class="slds-progress-bar slds-progress-bar_large aa-fillrun__bar"
                         role="progressbar"
                         aria-valuemin="0"
                         aria-valuemax="100"
                         aria-valuenow={percentLabel}>
                        <span class="slds-progress-bar__value" style={widthStyle}>
                            <span class="slds-assistive-text">Progress: {percentLabel}%</span>
                        </span>
                    </div>
                </template>

                <!-- Row 3: percent + duration -->
                <template lwc:if={hasProgressLine}>
                    <p class="slds-text-body_small slds-text-color_weak aa-fillrun__meta">
                        {progressLine}
                    </p>
                </template>

                <!-- Row 4: step summary -->
                <template lwc:if={hasStep}>
                    <p class="slds-text-body_regular aa-fillrun__step">{stepSummary}</p>
                </template>
                <template lwc:if={hasCurrentPage}>
                    <p class="slds-text-body_small slds-text-color_weak aa-fillrun__page">
                        {currentPage}
                    </p>
                </template>

                <!-- Row 5: live view link (queued / running / ready for review:
                     the hosted session stays open at the Declaration) -->
                <template lwc:if={hasLiveView}>
                    <p class="aa-fillrun__live">
                        <a href={liveViewUrl} target="_blank" rel="noopener">
                            <lightning-icon icon-name="utility:preview" size="xx-small"
                                            alternative-text="Live view"
                                            class="slds-m-right_xx-small">
                            </lightning-icon>
                            {liveViewLabel}
                        </a>
                    </p>
                </template>

                <!-- Row 5b: evidence file (Pre Submit PDF / Fill Issue) -->
                <template lwc:if={hasEvidence}>
                    <p class="aa-fillrun__live">
                        <a href={evidenceUrl} target="_blank" rel="noopener">
                            <lightning-icon icon-name="utility:file" size="xx-small"
                                            alternative-text="Evidence"
                                            class="slds-m-right_xx-small">
                            </lightning-icon>
                            {evidenceLabel}
                        </a>
                    </p>
                </template>

                <!-- Row 5c: things to check before submitting (hand-off) -->
                <template lwc:if={hasCheckNote}>
                    <div class="slds-notify slds-notify_alert slds-alert_warning aa-fillrun__error"
                         role="status">
                        <lightning-icon icon-name="utility:warning" size="xx-small"
                                        alternative-text="Check"
                                        class="slds-m-right_x-small">
                        </lightning-icon>
                        <span>{errorMessage}</span>
                    </div>
                </template>

                <!-- Row 6: error (only on failed/zombie) -->
                <template lwc:if={hasError}>
                    <div class="slds-notify slds-notify_alert slds-alert_error aa-fillrun__error"
                         role="alert">
                        <lightning-icon icon-name="utility:error" size="xx-small"
                                        alternative-text="Error"
                                        variant="inverse"
                                        class="slds-m-right_x-small">
                        </lightning-icon>
                        <span class="slds-assistive-text">Error:</span>
                        <span>{errorMessage}</span>
                    </div>
                </template>

            </div>
        </lightning-card>
    </template>
</template>
