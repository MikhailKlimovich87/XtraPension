<template>
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <div class="slds-modal__header">
                    <h2 class="slds-modal__title slds-hyphenate">{title}</h2>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <p>{message}</p>
                </div>
                <div class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={handleCancel}>No</button>
                    <button class="slds-button slds-button_brand" onclick={handleConfirm}>Yes</button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
