<template>
    <template lwc:if={isLoading}>
        <div class="slds-p-around_medium slds-text-align_center">
            <lightning-spinner alternative-text="Checking status…" size="small"></lightning-spinner>
            <p class="slds-m-top_small slds-text-color_weak">Checking whether this application is ready to fill…</p>
        </div>
    </template>

    <template lwc:elseif={working}>
        <div class="slds-p-around_medium slds-text-align_center">
            <lightning-spinner alternative-text="Starting fill run" size="small"></lightning-spinner>
            <p class="slds-m-top_small">Opening the DWP Pension Credit form and typing this client's answers in…</p>
        </div>
    </template>

    <!-- Gate panel — offers Force button for soft blocks (DECL / MANDATE),
         hard blocks (STAGE / already-submitted) show OK only. -->
    <template lwc:elseif={isGated}>
        <div class="slds-p-around_medium">
            <div class="slds-notify slds-notify_alert slds-theme_warning slds-m-bottom_medium" role="alert">
                <span class="slds-assistive-text">warning</span>
                <lightning-icon icon-name="utility:warning" alternative-text="Warning" size="x-small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                <h2 class="slds-text-heading_small">{gateHeadline}</h2>
            </div>
            <p class="slds-text-body_regular slds-m-bottom_small">{gateMessage}</p>
            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                Current stage: <strong>{currentStageLabel}</strong>
            </p>

            <template lwc:if={canForce}>
                <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                    <p class="slds-text-body_small slds-m-bottom_x-small">
                        <strong>Testing / manual override:</strong> {forceWarning}
                    </p>
                    <p class="slds-text-body_small slds-text-color_weak">
                        The fill worker still stops before Submit, so nothing is filed at DWP. Idempotency gates (already-submitted, in-flight run) are still enforced.
                    </p>
                </div>
            </template>

            <div class="slds-text-align_right">
                <template lwc:if={canForce}>
                    <lightning-button variant="destructive-text" label={forceButtonLabel} onclick={handleForceStart} class="slds-m-right_x-small"></lightning-button>
                </template>
                <lightning-button variant="brand" label="Close" onclick={handleClose}></lightning-button>
            </div>
        </div>
    </template>

    <template lwc:elseif={isReadyToStart}>
        <div class="slds-p-around_medium">
            <p class="slds-text-heading_small slds-m-bottom_x-small">
                Fill this client's Pension Credit form on DWP?
            </p>
            <p class="slds-text-body_regular slds-m-bottom_small">
                We'll open the real DWP application in the background and type every
                answer you've collected — claimant details, partner, home, income,
                benefits, pensions, bank details — all the way to the last page.
            </p>
            <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                <p class="slds-text-body_small">
                    <strong>Current mode: TESTING.</strong> The worker walks the DWP form to
                    the declaration page and stops. Nothing is filed at DWP, no award is
                    triggered — even after Start. Real submissions are gated on a Heroku
                    <code>AUTO_SUBMIT=true</code> config var that stays UNSET until we go live
                    with real clients (see <em>docs/pre-live-checklist.md § CRITICAL</em>).
                </p>
            </div>
            <div class="slds-text-align_right">
                <lightning-button label="Not yet" onclick={handleClose} class="slds-m-right_x-small"></lightning-button>
                <lightning-button variant="brand" label="Start filling" onclick={handleStart}></lightning-button>
            </div>
        </div>
    </template>
</template>
