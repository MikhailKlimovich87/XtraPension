<template>
    <lightning-card class="slds-p-around_medium">
        <div slot="title">
            REQUEST CHECK <br />
            <span class="comment-data">Generate a message to ask the check team to check a claim with the DWP.</span>
        </div>
        <div class="card-body">
            <p>
                <label class="custom-combobox-label ">Claim No<span class="request-sign"> *</span></label>
                <lightning-input type="search" placeholder="e.g. C00123 or 123" name="appNo" variant="label-hidden"
                    onchange={handleSearchChange} value={appName} disabled={isEmptyAppList}></lightning-input>
            </p>
            <template lwc:if={isExistSearchValue}>
                <div class="slds-p-horizontal_x-small">
                    <c-claim-check-search-result curr-app={searchValue}></c-claim-check-search-result>
                </div>
            </template>
            <div class="button-area">
                <lightning-button variant="brand" label="REQUEST CHECK" class="slds-m-left_x-small"
                    onclick={handleRequestCheck} disabled={isEmptySearchApp}></lightning-button>
            </div>
            <div class="comment-data">Agent will copy this message and send on the slack channel <a
                    href="https://xtrapensionworkspace.slack.com/archives/C08D48XMJBT">#15-hmrc-check</a></div>
        </div>
    </lightning-card>
</template>
