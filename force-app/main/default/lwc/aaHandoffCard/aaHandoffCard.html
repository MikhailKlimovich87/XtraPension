<template>
    <template lwc:if={hasHandoff}>
        <lightning-card title="Needs Human Attention" icon-name="utility:warning" class="handoff-card">
            <div class="slds-p-horizontal_medium slds-p-bottom_medium slds-theme_alert-texture slds-theme_error">
                <p class="slds-text-heading_small"><b>Escalation:</b> {handoff.Escalation_Type__c}</p>
                <p><b>Reason:</b> {handoff.Reason__c}</p>
                <template lwc:if={handoff.Last_Field_Question__c}>
                    <p><b>Last question:</b> {handoff.Last_Field_Question__c}</p>
                </template>
                <template lwc:if={handoff.Client_Verbatim__c}>
                    <p><b>Client said:</b> "{handoff.Client_Verbatim__c}"</p>
                </template>
                <template lwc:if={handoff.Next_Step_Suggestion__c}>
                    <p><b>Suggested next step:</b> {handoff.Next_Step_Suggestion__c}</p>
                </template>
                <div class="slds-p-top_small">
                    <lightning-button label="Mark Resolved" variant="brand" onclick={handleResolve}></lightning-button>
                </div>
            </div>
        </lightning-card>
    </template>
</template>
