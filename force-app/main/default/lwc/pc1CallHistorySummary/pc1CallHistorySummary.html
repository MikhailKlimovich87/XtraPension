<template>
    <lightning-card title="Call History" icon-name="standard:call_history">
        <div slot="actions">
            <button type="button" class="slds-button slds-button_neutral" onclick={openTab} title="Open full Call Logs related list">
                View all
            </button>
        </div>
        <div class="slds-p-horizontal_medium slds-p-bottom_small">
            <template lwc:if={hasError}>
                <div class="slds-text-body_small slds-text-color_error slds-p-around_small" role="alert">{errorText}</div>
            </template>
            <template lwc:elseif={hasCalls}>
                <div class="summary-row">
                    <span class="count-pill">{callCount}</span>
                    <span class="count-label">{callLabel}</span>
                </div>
                <ul class="call-list">
                    <template for:each={topThree} for:item="r">
                        <li key={r.id} class="call-row" data-id={r.id} onclick={openCall} tabindex="0" title="Open Call Log">
                            <div class="call-line-1">
                                <span class="dir-icon" aria-hidden="true">{r.dirIcon}</span>
                                <span class="call-when">{r.startedFmt}</span>
                                <span class={r.badgeCls}>{r.status}</span>
                            </div>
                            <div class="call-line-2">
                                <span class="meta-line">{r.metaLine}</span>
                                <template lwc:if={r.hasTranscript}>
                                    <a href={r.transcriptUrl} target="_blank" rel="noopener" class="ext-link" onclick={stopProp}>Transcript ↗</a>
                                </template>
                                <template lwc:if={r.hasRecording}>
                                    <a href={r.recordingUrl} target="_blank" rel="noopener" class="ext-link" onclick={stopProp}>Recording ↗</a>
                                </template>
                            </div>
                        </li>
                    </template>
                </ul>
            </template>
            <template lwc:else>
                <div class="slds-text-body_small slds-text-color_weak slds-p-around_small">No calls yet — inbound and outbound calls appear here.</div>
            </template>
            <template lwc:if={hasNextScheduled}>
                <div class="next-row">
                    <span class="next-label">Next scheduled:</span>
                    <span class="next-when">{nextScheduledFmt}</span>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
