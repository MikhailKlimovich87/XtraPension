<template>
  <lightning-card icon-name="standard:messaging_conversation" title="WhatsApp">
    <div slot="actions" class="xp-wa__actions">
      <template lwc:if={hasPhone}>
        <span class="xp-wa__live" title="Live: new messages show up within 15s"></span>
      </template>
      <lightning-button-icon icon-name={collapseIcon} variant="bare" alternative-text="Toggle" onclick={handleToggleCollapse} class="slds-m-left_xx-small"></lightning-button-icon>
    </div>

    <div class="xp-wa" style={bodyStyle}>
      <!-- Client / helper: only when the claim has a helper phone -->
      <template lwc:if={hasHelper}>
        <div class="xp-wa__whos slds-p-horizontal_medium slds-p-bottom_x-small" role="group" aria-label="Who to message">
          <template for:each={contactTabs} for:item="c">
            <button key={c.key} class={c.className} data-key={c.key} aria-pressed={c.pressed} onclick={handlePickContact} type="button">{c.label}</button>
          </template>
        </div>
      </template>
      <div class="xp-wa__subtitle slds-p-horizontal_medium slds-p-bottom_x-small">
        {headerSubtitle}
      </div>

      <!-- No phone for the client or helper picked -->
      <template lwc:if={showNoPhoneBanner}>
        <div class="xp-wa__banner slds-notify slds-notify_alert slds-theme_warning slds-m-horizontal_medium slds-m-bottom_small" role="alert">
          <span class="slds-assistive-text">warning</span>
          <lightning-icon icon-name="utility:warning" size="x-small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
          <span class="xp-wa__banner-text">{noPhoneText}</span>
        </div>
      </template>

      <!-- Load error -->
      <template lwc:if={loadError}>
        <div class="slds-notify slds-notify_alert slds-theme_error slds-m-horizontal_medium slds-m-bottom_small" role="alert">
          <lightning-icon icon-name="utility:error" size="x-small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
          {loadError}
        </div>
      </template>

      <!-- Message thread -->
      <div class="xp-wa__thread" role="log" aria-live="polite" onscroll={handleThreadScroll}>
        <template lwc:if={loading}>
          <div class="xp-wa__loading">
            <div class="xp-wa__skeleton is-in"></div>
            <div class="xp-wa__skeleton is-out"></div>
            <div class="xp-wa__skeleton is-in"></div>
          </div>
        </template>

        <template lwc:if={isEmpty}>
          <div class="xp-wa__empty">
            <lightning-icon icon-name="utility:chat" size="large" alternative-text="No messages" variant="warning"></lightning-icon>
            <p class="slds-m-top_small">No WhatsApp messages yet.</p>
            <p class="slds-text-body_small slds-text-color_weak">Send the first message below.</p>
          </div>
        </template>

        <template lwc:if={hasMessages}>
          <template for:each={messages} for:item="m">
            <div key={m.key} class="xp-wa__msg-wrap">
              <template lwc:if={m.showDay}>
                <div class="xp-wa__day">{m.dayLabel}</div>
              </template>
              <div class={m.bubbleClass}>
                <template lwc:if={m.showTopLabel}>
                  <div class="xp-wa__sender">{m.topLabel}</div>
                </template>
                <template lwc:if={m.hasAttachment}>
                  <template lwc:if={m.isImage}>
                    <a href={m.attachmentUrl} target="_blank" rel="noopener">
                      <img src={m.attachmentUrl} class="xp-wa__img" alt={m.attachmentFilename}/>
                    </a>
                  </template>
                  <template lwc:elseif={m.isAudio}>
                    <audio class="xp-wa__audio" controls preload="metadata" src={m.attachmentUrl}></audio>
                  </template>
                  <template lwc:else>
                    <div class="xp-wa__attach">
                      <a href={m.attachmentUrl} target="_blank" rel="noopener">
                        <lightning-icon icon-name="utility:attach" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                        {m.attachmentFilename}
                      </a>
                    </div>
                  </template>
                </template>
                <template lwc:if={m.text}>
                  <!-- one line on purpose: the text is pre-wrap, so no whitespace between the pieces -->
                  <div class="xp-wa__text"><template for:each={m.parts} for:item="p"><span key={p.key} class={p.cls}><template lwc:if={p.href}><a href={p.href} target="_blank" rel="noopener noreferrer">{p.text}</a></template><template lwc:else>{p.text}</template></span></template></div>
                </template>
                <div class="xp-wa__meta">
                  <template lwc:if={m.metaSender}>
                    <span class="xp-wa__by">{m.metaSender} ·</span>
                  </template>
                  <span class="xp-wa__time">{m.timeLabel}</span>
                  <template lwc:if={m.isOut}>
                    <span class="xp-wa__status">{m.statusLabel}</span>
                  </template>
                </div>
                <template lwc:if={m.failed}>
                  <button class="xp-wa__retry" data-key={m.key} onclick={handleRetry}>Retry</button>
                </template>
              </div>
            </div>
          </template>
        </template>
      </div>

      <!-- Attachment preview chip (when a file is picked before send) -->
      <template lwc:if={pendingFile}>
        <div class="xp-wa__pending">
          <lightning-icon icon-name="utility:attach" size="x-small" class="slds-m-right_x-small"></lightning-icon>
          <span class="xp-wa__pending-name">{pendingFile.name}</span>
          <span class="xp-wa__pending-size">({pendingFile.sizeLabel})</span>
          <button class="xp-wa__pending-x" onclick={handleCancelFile} title="Remove attachment">✕</button>
        </div>
      </template>

<!-- Emoji picker overlay -->
      <template lwc:if={showEmojiPicker}>
        <c-xp-emoji-picker onpick={handleEmojiPick} onclose={handleEmojiClose}></c-xp-emoji-picker>
      </template>

      <!-- SF Files picker — full-screen modal with search -->
      <template lwc:if={showSfPicker}>
        <div class="xp-wa__modal-overlay" onclick={handleSfModalOverlayClick}>
          <div class="xp-wa__modal" onclick={handleStopPropagation}>
            <div class="xp-wa__modal-header">
              <h3>Attach from Salesforce Files</h3>
              <button class="xp-wa__x" onclick={handleToggleSfPicker} type="button" title="Close">✕</button>
            </div>
            <div class="xp-wa__modal-search">
              <input type="text" placeholder="Search by name, type…" value={sfSearchQuery} oninput={handleSfSearchInput} class="xp-wa__modal-searchbox" />
              <span class="xp-wa__modal-count">{filteredSfFilesCountLabel}</span>
            </div>
            <div class="xp-wa__modal-body">
              <template lwc:if={hasFilteredSfFiles}>
                <ul class="xp-wa__sf-list">
                  <template for:each={filteredSfFiles} for:item="f">
                    <li key={f.contentVersionId} class="xp-wa__sf-item" data-id={f.contentVersionId} onclick={handleSfFilePick}>
                      <lightning-icon icon-name={f.icon} size="small" class="slds-m-right_small"></lightning-icon>
                      <div class="xp-wa__sf-info">
                        <div class="xp-wa__sf-name">{f.title}</div>
                        <div class="xp-wa__sf-meta">{f.fileType} · {f.sizeLabel} · {f.dateLabel}</div>
                      </div>
                      <span class="xp-wa__sf-pick">Attach →</span>
                    </li>
                  </template>
                </ul>
              </template>
              <template lwc:elseif={loadingSfFiles}>
                <div class="xp-wa__sf-empty">Loading…</div>
              </template>
              <template lwc:elseif={hasSfSearchQuery}>
                <div class="xp-wa__sf-empty">No files match "{sfSearchQuery}".</div>
              </template>
              <template lwc:else>
                <div class="xp-wa__sf-empty">No files linked to this claim yet.<br>Upload one to the Files section of this claim first.</div>
              </template>
            </div>
          </div>
        </div>
      </template>

      <!-- Composer: textarea full-width on top, action strip below -->
      <div class="xp-wa__composer" lwc:if={showComposer}>
        <textarea
          class="xp-wa__ta"
          placeholder={composerPlaceholder}
          value={composerText}
          oninput={handleComposeInput}
          onkeydown={handleKeydown}
          onpaste={handleComposePaste}
          disabled={disableAll}
          rows="2"
          maxlength="4096"
          aria-label="WhatsApp message"
        ></textarea>
        <div class="xp-wa__actionrow">
          <div class="xp-wa__leftactions">
            <button class="xp-wa__iconbtn" title="Emoji" onclick={handleToggleEmoji} disabled={disableAll} type="button">😊</button>
            <button class="xp-wa__aibtn" title="Draft a reply with XP AI (it is not sent). Anything typed in the box is used as the instruction." onclick={handleAiReply} disabled={disableAll} type="button">
              <template lwc:if={draftingReply}>
                <span class="xp-wa__aispin"></span>
              </template>
              <template lwc:else>
                <span aria-hidden="true">✨</span>
              </template>
              <span class="xp-wa__ailabel">{aiReplyLabel}</span>
            </button>
            <button class="xp-wa__aibtn" title="Improve the text in the box (spelling, grammar, tone) without changing what it says. It is not sent." onclick={handleRewrite} disabled={rewriteDisabled} type="button">
              <template lwc:if={draftingRewrite}>
                <span class="xp-wa__aispin"></span>
              </template>
              <template lwc:else>
                <span aria-hidden="true">✍️</span>
              </template>
              <span class="xp-wa__ailabel">{rewriteLabel}</span>
            </button>
            <template lwc:if={canUndo}>
              <button class="xp-wa__undo" title="Go back to your original text" onclick={handleUndoRewrite} type="button">Undo</button>
            </template>
            <div class="xp-wa__plus-wrap">
              <button class="xp-wa__iconbtn" title="Message templates: Form reminder, DocuSign reminder, Claim posted (fills the box, nothing is sent)" onclick={handleToggleTemplates} disabled={disableAll} type="button">
                <lightning-icon icon-name="utility:quick_text" size="x-small" alternative-text="Message templates"></lightning-icon>
              </button>
              <template lwc:if={showTemplates}>
                <div class="xp-wa__plus-menu">
                  <template for:each={templateItems} for:item="t">
                    <button key={t.key} class="xp-wa__plus-item" data-key={t.key} onclick={handleTemplatePick} type="button">{t.label}</button>
                  </template>
                </div>
              </template>
            </div>
            <div class="xp-wa__plus-wrap">
              <button class="xp-wa__iconbtn" title="Attach a file" onclick={handleTogglePlusMenu} disabled={disableAll} type="button">
                <lightning-icon icon-name="utility:add" size="x-small"></lightning-icon>
              </button>
              <template lwc:if={showPlusMenu}>
                <div class="xp-wa__plus-menu">
                  <button class="xp-wa__plus-item" onclick={handleClickUploadFromDevice} type="button">
                    <lightning-icon icon-name="utility:upload" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                    Upload from computer
                  </button>
                  <button class="xp-wa__plus-item" onclick={handleClickFromSf} type="button">
                    <lightning-icon icon-name="doctype:attachment" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                    From Salesforce Files
                  </button>
                </div>
              </template>
            </div>
          </div>
          <button class="slds-button slds-button_brand xp-wa__send" disabled={sendDisabled} onclick={handleSend} type="button">
            <template lwc:if={sending}>
              <lightning-spinner alternative-text="Sending" size="x-small" variant="inverse"></lightning-spinner>
            </template>
            <template lwc:else>
              Send
            </template>
          </button>
        </div>

        <!-- Native hidden file input triggered by the "+" menu -->
        <input type="file" class="xp-wa__native-file" onchange={handleNativeFileChange} accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx,.txt,.csv,.mp3,.m4a,.ogg,.mp4" />
      </div>
    </div>
  </lightning-card>
</template>
