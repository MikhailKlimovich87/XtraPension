<template>
    <lightning-card title="Stage" icon-name="standard:record_lookup">
        <p class="slds-p-horizontal_medium slds-text-body_small slds-text-color_weak aa-sub">Move this Application through the pipeline</p>
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <lightning-combobox
                label="Stage"
                value={selected}
                options={options}
                onchange={handleSelect}>
            </lightning-combobox>
            <!-- Closed - Refused only: the refusal has to be written down
                 (AA_StageTransitionHelper.decisionGuard refuses the move
                 without it). Kept on the stage log. -->
            <template lwc:if={noteRequired}>
                <lightning-textarea
                    class="slds-var-m-top_x-small"
                    label="DWP refusal: date of the decision letter and the reason"
                    value={note}
                    max-length={noteMax}
                    onchange={handleNote}
                    required>
                </lightning-textarea>
            </template>
            <div class="slds-var-m-top_small">
                <lightning-button
                    label="Change Stage"
                    variant="brand"
                    onclick={handleChangeStage}
                    disabled={changeDisabled}
                    icon-name="utility:change_record_type">
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
