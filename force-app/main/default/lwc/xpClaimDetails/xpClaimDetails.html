<template>
    <div class="slds-card details">
        <div class="finder">
            <lightning-input
                type="search"
                label="Find a field"
                variant="label-hidden"
                placeholder="Find a field or value (e.g. NINO, PPS, IBAN, tracking)"
                value={query}
                onchange={handleQuery}
                onkeydown={handleKey}
            ></lightning-input>
            <template lwc:if={hasResults}>
                <ul class="results">
                    <template for:each={results} for:item="r">
                        <li key={r.name}>
                            <button type="button" class="result" data-name={r.name} onclick={goToField}>
                                <span class="top">
                                    <span class="label">{r.label}</span>
                                    <span class="where">{r.where}</span>
                                </span>
                                <template lwc:if={r.empty}><span class="value empty">(empty)</span></template>
                                <template lwc:else><span class="value">{r.text}</span></template>
                            </button>
                        </li>
                    </template>
                </ul>
            </template>
            <template lwc:if={noResults}>
                <p class="none">No field with that name on this page.</p>
            </template>
        </div>

        <template lwc:if={ready}>
            <lightning-tabset active-tab-value={activeTab}>
                <template for:each={tabs} for:item="t">
                    <lightning-tab key={t.id} label={t.title} value={t.id} onactive={handleTabActive}>
                        <template lwc:if={t.isForms}>
                            <lightning-tabset variant="scoped" class="editors">
                                <template for:each={editors} for:item="e">
                                    <lightning-tab key={e.key} label={e.label} value={e.flow}>
                                        <lightning-flow
                                            flow-api-name={e.flow}
                                            flow-input-variables={flowInputs}
                                            onstatuschange={handleFlowStatus}
                                        ></lightning-flow>
                                    </lightning-tab>
                                </template>
                            </lightning-tabset>
                        </template>
                        <template lwc:else>
                        <lightning-record-edit-form
                            object-api-name="Basic__c"
                            record-id={recordId}
                            onsubmit={handleSubmit}
                            onsuccess={handleSaved}
                            onerror={handleError}
                        >
                            <template lwc:if={t.editing}>
                                <lightning-messages></lightning-messages>
                            </template>
                            <template for:each={t.sections} for:item="s">
                                <div key={s.key} class={s.sectionClass}>
                                    <h3 class="slds-section__title">
                                        <button
                                            type="button"
                                            class="slds-button slds-section__title-action"
                                            aria-expanded={s.ariaExpanded}
                                            data-key={s.key}
                                            onclick={toggleSection}
                                        >
                                            <lightning-icon
                                                icon-name="utility:switch"
                                                size="x-small"
                                                class="slds-section__title-action-icon slds-button__icon_left"
                                            ></lightning-icon>
                                            <span class="slds-truncate" title={s.name}>{s.name}</span>
                                        </button>
                                    </h3>
                                    <template lwc:if={s.open}>
                                        <div class="slds-section__content grid">
                                            <template for:each={s.cols} for:item="col">
                                                <div key={col.key} class="col">
                                                    <template for:each={col.fields} for:item="f">
                                                        <div key={f.api} class={f.cls} data-api={f.api}>
                                                            <template lwc:if={f.addressInput}>
                                                                <fieldset class="addr-edit">
                                                                    <legend class="slds-form-element__label">{f.label}</legend>
                                                                    <template for:each={f.parts} for:item="p">
                                                                        <lightning-input-field key={p} field-name={p}></lightning-input-field>
                                                                    </template>
                                                                </fieldset>
                                                            </template>
                                                            <template lwc:elseif={f.input}>
                                                                <lightning-input-field field-name={f.api} required={f.required}></lightning-input-field>
                                                            </template>
                                                            <template lwc:else>
                                                                <template lwc:if={f.address}>
                                                                    <div class="slds-form-element slds-form-element_readonly" ondblclick={startEdit}>
                                                                        <span class="slds-form-element__label">{f.label}</span>
                                                                        <div class="slds-form-element__control">
                                                                            <div class="slds-form-element__static addr">{f.text}</div>
                                                                        </div>
                                                                    </div>
                                                                </template>
                                                                <template lwc:elseif={f.email}>
                                                                    <div class="slds-form-element slds-form-element_readonly" ondblclick={startEdit}>
                                                                        <span class="slds-form-element__label">{f.label}</span>
                                                                        <div class="slds-form-element__control">
                                                                            <div class="slds-form-element__static">
                                                                                <template lwc:if={f.text}>
                                                                                    <a href={f.mailto} data-email={f.text} onclick={openEmail}>{f.text}</a>
                                                                                </template>
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                </template>
                                                                <template lwc:else>
                                                                    <lightning-output-field field-name={f.api} ondblclick={startEdit}></lightning-output-field>
                                                                </template>
                                                                <template lwc:if={f.pencil}>
                                                                    <lightning-button-icon
                                                                        class="pen"
                                                                        icon-name="utility:edit"
                                                                        variant="bare"
                                                                        size="small"
                                                                        alternative-text="Edit"
                                                                        title="Edit"
                                                                        onclick={startEdit}
                                                                    ></lightning-button-icon>
                                                                </template>
                                                            </template>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                        <template lwc:if={s.list}>
                                            <div class="list">
                                                <span class="slds-form-element__label">{s.list.title}</span>
                                                <template lwc:if={s.list.empty}>
                                                    <p class="list-empty">None listed.</p>
                                                </template>
                                                <template for:each={s.list.rows} for:item="row">
                                                    <a key={row.id} href={row.url} class="list-row">
                                                        <span class="list-main">{row.line1}</span>
                                                        <span class="list-sub">{row.line2}</span>
                                                    </a>
                                                </template>
                                            </div>
                                        </template>
                                    </template>
                                </div>
                            </template>
                            <template lwc:if={t.editing}>
                                <div class="footer">
                                    <lightning-button label="Cancel" onclick={cancelEdit}></lightning-button>
                                    <lightning-button variant="brand" type="submit" label="Save" disabled={saving}></lightning-button>
                                </div>
                            </template>
                        </lightning-record-edit-form>
                        </template>
                    </lightning-tab>
                </template>
            </lightning-tabset>
        </template>
        <template lwc:else>
            <div class="loading"><lightning-spinner alternative-text="Loading" size="small"></lightning-spinner></div>
        </template>
    </div>
</template>
