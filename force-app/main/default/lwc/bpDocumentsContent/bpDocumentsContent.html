<template>
    <lightning-card title="Docs">
        <lightning-tabset variant="scoped" active-tab-value={activeTab}>
            <template for:each={tabs} for:item="tab">
                <lightning-tab label={tab.label} value={tab.value} title={tab.hint} key={tab.value} onactive={handleTabActive}>
                    <div class="list">
                        <template for:each={tab.docs} for:item="doc">
                            <div class="doc" key={doc.documentId}>
                                <div class="top">
                                    <a onclick={navigateToFiles} value={doc.title}>
                                        <u>{doc.label}</u>
                                    </a>
                                </div>
                                <div>{doc.createdDate}</div>
                            </div>
                        </template>
                        <template if:true={tab.isEmpty}>
                            <div class="empty">No documents yet.</div>
                        </template>
                    </div>
                </lightning-tab>
            </template>
        </lightning-tabset>
        <div slot="footer">
            <a class="slds-card__footer-action" onclick={handleDisplayAll}>
                View All
            </a>
        </div>
    </lightning-card>
</template>
