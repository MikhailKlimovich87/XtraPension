<template>
    <lightning-quick-action-panel header="Send to Validation">
        <template lwc:if={loading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>

        <template lwc:if={errorMessage}>
            <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
                <h2>{errorMessage}</h2>
            </div>
        </template>

        <template lwc:if={state}>
            <p class="slds-text-heading_small slds-m-bottom_small">{agentLine}</p>
            <template lwc:if={state.allowed}>
                <template lwc:if={state.complete}>
                    <p>{afterNote}</p>
                </template>
                <template lwc:else>
                    <p class="slds-text-title_bold slds-m-bottom_x-small">{missingTitle}</p>
                    <ul class="slds-list_dotted slds-m-bottom_small">
                        <template for:each={missingItems} for:item="item">
                            <li key={item.key}>{item.text}</li>
                        </template>
                    </ul>
                    <p>{afterNote}</p>
                </template>
                <p class="slds-m-top_medium slds-text-color_weak">
                    The form saves itself every minute: if it is still open, wait for "Form Auto Saved" before sending.
                </p>
            </template>
            <template lwc:else>
                <p>{state.blockedReason}</p>
            </template>
        </template>

        <div slot="footer">
            <lightning-button variant="neutral" label="Cancel" onclick={handleCancel}></lightning-button>
            <lightning-button variant="brand" class="slds-m-left_x-small" label="Send to Validation"
                onclick={handleSend} disabled={cannotSend}></lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
